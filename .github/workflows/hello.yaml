name: pipeline-project

on:
  push:
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Run Hello World JS Action
        uses: actions/hello-world-javascript-action@main
        with:
          who-to-greet: "GitHub Actions Student"
          
      - name: Print Production Environment Variable
        run: echo "The current environment is:${{ vars.MY_ENVIRONMENT }}"

  Linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Hadolint-scan
        run: echo "Hadolint command"

      - name: Notify Slack (Hadolint)
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Hadolint worked'

      - name: Bandit-scan
        run: echo "bandit command"

      - name: Notify Slack (Bandit)
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'bandit worked'

      - name: Linting-scan
        run: echo "Shell command"

      - name: Notify Slack (Linting)
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Linting worked'

  Security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        run: echo "trivy command"
       
      - name: Run Bandit Scan
        run: echo "bandit"

  Build-and-push: 
    runs-on: ubuntu-latest
    needs: [Linting, Security] 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . 
          push: true 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/test10:latest 
      
      - name: Notify Slack (Build Success)
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'build and push is done'
  
  Helm install:
    runs-on: ubuntu-latest
    needs: [Linting, Security,Build-and-push] 
    
    steps:
    - name: Install Helm
      uses: azure/setup-helm@v4
